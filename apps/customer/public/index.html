<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Print your document</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="container">

  <header id="shopHeader">
    <h1 id="shopName">Loading shop...</h1>
  </header>

  <div id="screen-error" class="screen" hidden>
    <p class="error-text">Shop not found. Please re-scan the QR code.</p>
  </div>

  <div id="screen-upload" class="screen" hidden>
    <h2>1. Choose a file</h2>
    <p class="hint">PDF, JPG or PNG — max 4 MB</p>
    <input type="file" id="fileInput" accept=".pdf,.jpg,.jpeg,.png" />
    <p id="uploadError" class="error-text" hidden></p>
    <button id="uploadBtn" disabled>Continue</button>
  </div>

  <div id="screen-options" class="screen" hidden>
    <h2>2. Print options</h2>
    <p id="fileInfo" class="hint"></p>

    <label>Copies</label>
    <input type="number" id="copiesInput" value="1" min="1" />

    <label>Paper size</label>
    <div class="radio-group">
      <label><input type="radio" name="paperSize" value="A4" checked /> A4</label>
      <label><input type="radio" name="paperSize" value="A3" /> A3</label>
    </div>

    <label>Color</label>
    <div class="radio-group">
      <label><input type="radio" name="colorMode" value="BW" checked /> Black &amp; White</label>
      <label><input type="radio" name="colorMode" value="COLOR" /> Color</label>
    </div>

    <label><input type="checkbox" id="duplexInput" /> Double-sided (duplex)</label>

    <label>Page range <span class="hint">(leave blank for all pages, e.g. 1-3,5)</span></label>
    <input type="text" id="pageRangeInput" placeholder="All pages" />

    <p id="optionsError" class="error-text" hidden></p>

    <div class="price-box">
      <span>Total price</span>
      <span id="priceDisplay">—</span>
    </div>

    <button id="submitBtn" disabled>Submit &amp; Print</button>
  </div>

  <div id="screen-submitting" class="screen" hidden>
    <p>Submitting your print job...</p>
  </div>

  <div id="screen-tracking" class="screen" hidden>
    <h2>Your print job</h2>
    <div class="status-badge" id="statusBadge">QUEUED</div>
    <p id="trackingInfo" class="hint"></p>
    <p id="trackingPrice"></p>
    <p class="hint" id="trackingHint">This page updates automatically.</p>
  </div>

</div>
<script src="app.js"></script>
</body>
</html>
